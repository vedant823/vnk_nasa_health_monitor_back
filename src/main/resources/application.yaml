spring:
  application:
    name: api
  mongodb:
    uri: mongodb://localhost:27017/healthmonitor
  data:
    mongodb:
      auto-index-creation: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  data-dir: jsonData
  cors:
    allowed-origins: http://localhost:5173,https://hoppscotch.io
  defaults:
    measurement-frequency-days: 7
  images:
    max-dimension: 1024
    quality: 0.7
    quality-floor: 0.3
    max-stored-bytes: 262144
    max-upload-bytes: 16777216
  notifications:
    enabled: true
    cron: "0 0 8 * * *"
