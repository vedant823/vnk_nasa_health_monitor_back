openapi: 3.1.0
info:
  title: Health Monitor API
  version: 1.0.0
  description: |
    Crew health monitoring backend (NASA Space Apps). Astronauts log measurements;
    the backend scores them against guideline ranges into per-risk health scores
    (1-100), tracks readings against the user's own baseline, and produces
    daily/weekly/monthly measurement reminders.

    Auth: `POST /users/login` creates an account and `PUT /users/login` logs in -
    both return the token as a raw JSON string body. Send it as
    `Authorization: Bearer <token>` on every `/users/**` request.
    `/data/**` is public static content.

    Import this file into Hoppscotch via *Import from OpenAPI*, or into
    Postman, Insomnia, and most other API tools.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Account creation and login
  - name: User data
    description: User data, reminders, and risk scores (Bearer token required)
  - name: Officer
    description: The officer's read + score view of their children (Bearer token required)
  - name: Static data
    description: Risk and measurement definitions (no auth)
paths:
  /users/login:
    post:
      tags: [Auth]
      operationId: createAccount
      summary: Create an account
      description:
        Creates a new account with the given credentials, initializes every
        measurement's reminder frequency to the default (7 days), and returns the
        new account's token. Fails with 409 if the username is already taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The token, as a raw JSON string body (e.g. `"3f2c9a1e-..."`)
          content:
            application/json:
              schema:
                type: string
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      tags: [Auth]
      operationId: login
      summary: Log in
      description:
        Verifies the credentials and returns the existing account's token, so
        logging in on another device returns the same token. Fails with 401 for
        wrong credentials. PUT (not GET) because the request carries a credentials
        body, which browsers cannot send with GET — and login is idempotent, which
        fits PUT semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The token, as a raw JSON string body
          content:
            application/json:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /users/measurements/{measurementID}:
    get:
      tags: [User data]
      operationId: getMeasurements
      summary: Get a measurement's logged history
      description:
        Returns the user's logged history for one measurement, newest first.
        Values of baseline-relative measurements are served as the change from the
        user's baseline (percent or plain difference per `baselineMode`); absolute
        measurements are returned raw.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
      responses:
        "200":
          description: The history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasurementSet"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [User data]
      operationId: logMeasurement
      summary: Log a measurement
      description:
        Logs one reading as a MeasurementSet and updates the measurement's
        last-taken time, which drives reminders and risk scoring. The first logged
        reading of a baseline-relative measurement becomes the user's baseline;
        later readings are stored raw and converted on the way out. Numerical
        measurements require `values` (finite, and non-negative unless the
        measurement `canBeNegative`); visual measurements require `image`
        (base64). Returns an empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogMeasurementRequest"
      responses:
        "200":
          description: Logged (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [User data]
      operationId: deleteMeasurement
      summary: Delete a logged measurement
      description:
        Deletes the most recent reading, or the reading at the given
        `measurementIndex` in the newest-first order the GET history endpoint
        serves (0 = most recent). For baseline-relative measurements, the
        baseline reading (the chronologically first one) cannot be deleted
        while other readings exist; deleting it as the only reading also
        clears the stored baseline, so a re-log starts a fresh one. The
        last-taken time is recomputed from the remaining history. Returns an
        empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
        - name: measurementIndex
          in: query
          required: false
          description: Index into the newest-first history (0 = most recent)
          schema:
            type: integer
      responses:
        "200":
          description: Deleted (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/measurements/{measurementID}/score:
    put:
      tags: [User data]
      operationId: setVisualScore
      summary: Record the CMO's abnormality count for a visual reading
      description:
        Sets how many abnormalities the Crew Medical Officer observed in one
        logged visual measurement — the most recent one by default, or the
        reading at `measurementIndex` in the newest-first order the GET history
        endpoint serves (0 = most recent). Only visual measurements can be
        scored, the count cannot be negative, and only a user without an
        officer can judge images (a medical officer, or a standalone user
        acting as their own CMO; a child gets 403 and their officer scores
        through the child-scoped endpoint). In risk scoring, one
        abnormality counts as abnormal (−40) and two or more as dangerous
        (−75). Returns an empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
        - name: numAbnormal
          in: query
          required: true
          description: Number of abnormalities observed in the image (0 = reviewed and normal)
          schema:
            type: integer
            minimum: 0
        - name: measurementIndex
          in: query
          required: false
          description: Index into the newest-first history (0 = most recent)
          schema:
            type: integer
      responses:
        "200":
          description: Scored (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The caller has an officer
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/measurements/{measurementID}/frequency:
    put:
      tags: [User data]
      operationId: setFrequency
      summary: Set the reminder frequency
      description:
        Sets how many days pass between reminders for one measurement (the
        frontend's frequency dropdown). The next due date becomes last-taken plus
        this many days. Returns an empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFrequencyRequest"
      responses:
        "200":
          description: Updated (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/measurements/{measurementID}/trend:
    get:
      tags: [User data]
      operationId: getTrend
      summary: Get a measurement's trend direction
      description:
        Compares the measurement's two most recent baseline-adjusted readings and
        returns their direction — a lightweight hint for the frontend graphs, no
        statistical modelling. `up` and `down` are raw directions; whether that is
        good or bad depends on the measurement.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
      responses:
        "200":
          description: The trend direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementTrend"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/upcoming:
    get:
      tags: [User data]
      operationId: getUpcoming
      summary: Get upcoming reminders
      description:
        Lists every measurement due within the given window, ordered by due date.
        A measurement is due when `lastTaken + frequencyDays` has passed, or
        immediately if never taken — so a fresh account's list is the complete
        baseline checklist.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: withinDays
          in: query
          required: false
          description: Window in days (default 30)
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Reminders, dueDate ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/risks:
    get:
      tags: [User data]
      operationId: getRisks
      summary: Get all risk scores
      description:
        Scores every risk factor for the user with the rule-based JudgementService
        (start at 100; −40 per abnormal and −75 per dangerous latest reading,
        stacked, floored at 1). Risks without measurements yet always score 100.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: One evaluation per risk factor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskEvaluation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/risks/{riskID}:
    get:
      tags: [User data]
      operationId: getRisk
      summary: Get one risk score
      description:
        Returns one risk's score, the advice list (the recommendation string of
        every violated measurement, most severe first), and a reason string
        describing each violation.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RiskID"
      responses:
        "200":
          description: The risk evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/digest:
    get:
      tags: [User data]
      operationId: getDigest
      summary: Get the daily/weekly/monthly digest
      description: >-
        Returns the user's daily/weekly/monthly reminder digest — the exact
        buckets the scheduled notification sender delivers, built from one 30-day
        snapshot and partitioned into disjoint buckets. Each measurement lands in
        exactly one bucket, the smallest window it is due within (daily holds the
        urgent, including overdue, set; a fresh user's weekly and monthly buckets
        are empty).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderDigest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/badges:
    get:
      tags: [User data]
      operationId: getBadges
      summary: Get the user's badges
      description:
        Lists every badge, split into the definitions of the earned ones and,
        for the unearned ones, the badge plus a per-criterion progress fraction
        (0.0-1.0) of the required readings (or days) completed. A badge is
        earned when every one of its criteria is satisfied. Criteria can
        require distinct days, consecutive-day streaks, and readings within
        the measurement's normal range (baseline-adjusted); visual
        measurements never satisfy isOk criteria. Evaluated live from the
        user's history.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The user's badges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/environment:
    get:
      tags: [User data]
      operationId: getEnvironment
      summary: Get the user's current environment
      description:
        Returns the environment the user is currently in (spacecraft, station,
        rover, moon, or mars). It selects the guideline ranges used for risk
        scoring and badge evaluation. New accounts default to spacecraft.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The environment label, e.g. `spacecraft`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [User data]
      operationId: setEnvironment
      summary: Set the user's environment
      description:
        Sets the environment the user is in, which determines the guideline
        ranges used in analysis. The value is given in `newEnvironment` and
        must be one of spacecraft, station, rover, moon, or mars (case
        insensitive). Returns an empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: newEnvironment
          in: query
          required: true
          description: The environment to switch to
          schema:
            $ref: "#/components/schemas/Environment"
      responses:
        "200":
          description: Updated (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/status:
    get:
      tags: [User data]
      operationId: getStatus
      summary: Get the user's status
      description:
        Returns the user's role (`normal` or `medical officer`). The status
        determines whether the user can have children (crewmates) or an
        officer, and whether they can judge visual images. New accounts
        default to normal.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The status label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [User data]
      operationId: setStatus
      summary: Set the user's status
      description:
        Sets the user's role, given in `newStatus` (`normal` or
        `medical officer`, case-insensitive). The status cannot change
        while the user has an officer or children — remove the
        relationship first. Returns an empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: newStatus
          in: query
          required: true
          description: The status to switch to
          schema:
            $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          description: Updated (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/officer:
    get:
      tags: [User data]
      operationId: getOfficer
      summary: Get the user's officer
      description:
        Returns the username of the officer supervising this user, or null
        when the user is standalone.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The officer's username, or null
          content:
            application/json:
              schema:
                type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [User data]
      operationId: setOfficer
      summary: Set the user's officer
      description:
        Sets (or changes, at will) the officer supervising this user, given
        by username in `newOfficer`. The named user must exist (404), must
        be a medical officer (409), must not be the caller (409), and must
        not have an officer of their own (409). A medical officer cannot
        take an officer (409). Officers are read + score only. Returns an
        empty 200 body.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: newOfficer
          in: query
          required: true
          description: The username of the medical officer to assign
          schema:
            type: string
      responses:
        "200":
          description: Updated (empty body)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/children:
    get:
      tags: [Officer]
      operationId: getChildren
      summary: List the officer's children
      description:
        Lists the children currently assigned to the officer, each with
        their most recent measurement timestamp for a home overview. An
        officer with no children gets an empty list.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The children
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChildOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/overdue:
    get:
      tags: [Officer]
      operationId: getOverdue
      summary: List overdue measurements across the officer's children
      description:
        Returns every overdue measurement of every child assigned to the
        officer, ordered by due date — due when last-taken plus the
        frequency has passed, or immediately if never taken. Only medical
        officers can call it (403 otherwise). Each entry names the child
        it belongs to.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The overdue measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChildReminder"
        "403":
          description: The caller is not a medical officer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/children/{childID}/risks:
    get:
      tags: [Officer]
      operationId: getChildRisks
      summary: Get a child's risk scores
      description:
        Scores every risk factor for the child exactly as the child's own
        GET /users/risks would. Unknown child 404; a child assigned to
        someone else (or to nobody) 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ChildID"
      responses:
        "200":
          description: The child's risk scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskEvaluation"
        "403":
          description: The child is not assigned to this officer
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/children/{childID}/risks/{riskID}:
    get:
      tags: [Officer]
      operationId: getChildRisk
      summary: Get one risk score of a child
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ChildID"
        - $ref: "#/components/parameters/RiskID"
      responses:
        "200":
          description: The child's risk evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluation"
        "403":
          description: The child is not assigned to this officer
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/children/{childID}/measurements/{measurementID}:
    get:
      tags: [Officer]
      operationId: getChildMeasurements
      summary: Get a child's measurement history
      description:
        The child's logged history for one measurement, newest first — the
        officer's view for reviewing visual scans.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ChildID"
        - $ref: "#/components/parameters/MeasurementID"
      responses:
        "200":
          description: The child's history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasurementSet"
        "403":
          description: The child is not assigned to this officer
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/children/{childID}/measurements/{measurementID}/score:
    put:
      tags: [Officer]
      operationId: setChildScore
      summary: Record the CMO's abnormality count for a child's visual reading
      description:
        The officer's CMO review of one of the child's visual readings —
        identical semantics to the user-scoped score endpoint, applied to
        the child's most recent reading (or the one at `measurementIndex`
        in the newest-first order).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ChildID"
        - $ref: "#/components/parameters/MeasurementID"
        - name: numAbnormal
          in: query
          required: true
          description: Number of abnormalities observed in the image (0 = reviewed and normal)
          schema:
            type: integer
            minimum: 0
        - name: measurementIndex
          in: query
          required: false
          description: Index into the newest-first history (0 = most recent)
          schema:
            type: integer
      responses:
        "200":
          description: Scored (empty body)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The child is not assigned to this officer
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/children/{childID}/upcoming:
    get:
      tags: [Officer]
      operationId: getChildUpcoming
      summary: List a child's upcoming measurements
      description:
        The child's due reminders within the given window, ordered by due
        date, so the officer sees who is behind on their baseline
        checklist.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ChildID"
        - name: withinDays
          in: query
          required: false
          description: The window in days (default 30)
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: The child's reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "403":
          description: The child is not assigned to this officer
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /data/risks:
    get:
      tags: [Static data]
      operationId: listRisks
      summary: List all risk factors
      description:
        Returns every risk factor in file order, so the frontend's home grid
        hardcodes nothing. No authentication.
      responses:
        "200":
          description: All risk factors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskFactor"
  /data/risks/{riskID}:
    get:
      tags: [Static data]
      operationId: getRiskFactor
      summary: Get one risk factor
      description:
        Returns one risk's display name, category, the reason to pay attention to
        it, and its child measurement IDs (empty for risks with no usable data
        yet).
      parameters:
        - $ref: "#/components/parameters/RiskID"
      responses:
        "200":
          description: The risk factor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskFactor"
        "404":
          $ref: "#/components/responses/NotFound"
  /data/measurements/{measurementID}:
    get:
      tags: [Static data]
      operationId: getMeasurement
      summary: Get a measurement's definition and instructions
      description: >-
        Returns one measurement's full definition - display name, category, unit,
        guideline bounds (optional per side), baseline mode, the low/high
        recommendation strings, and the step-by-step instructions. Merged at
        startup from measurementDetails.json and measurementInstructions.json.
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
      responses:
        "200":
          description: The measurement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
        "404":
          $ref: "#/components/responses/NotFound"
  /data/measurements/{measurementID}/flags:
    get:
      tags: [Static data]
      operationId: getMeasurementFlags
      summary: Get a visual measurement's observable abnormalities
      description:
        Returns the list of abnormalities (flags) a Crew Medical Officer can
        observe in the visual measurement's images, from measurementFlags.json.
        The frontend presents them as a review checklist; the count of
        observed flags becomes `numAbnormal` on the score endpoint.
      parameters:
        - $ref: "#/components/parameters/MeasurementID"
      responses:
        "200":
          description: The flags
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: The measurement is not visual
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The token returned by POST/PUT /users/login
  parameters:
    MeasurementID:
      name: measurementID
      in: path
      required: true
      description: A measurement ID from the data endpoints (e.g. `body_mass_change`)
      schema:
        type: string
    RiskID:
      name: riskID
      in: path
      required: true
      description: A risk ID from `GET /data/risks` (e.g. `nutrition`)
      schema:
        type: string
    ChildID:
      name: childID
      in: path
      required: true
      description: The user ID of one of the officer's children, from `GET /users/children`
      schema:
        type: string
  responses:
    BadRequest:
      description:
        Bad request — missing Authorization header, validation error, or invalid
        measurement values
    Unauthorized:
      description: Invalid token or wrong credentials
    NotFound:
      description: Unknown measurement or risk ID
    Conflict:
      description: Username already taken
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LogMeasurementRequest:
      type: object
      description:
        Exactly one of `values` (numerical measurements) or `image` (visual
        measurements, base64) must be present, matching the measurement's
        category.
      properties:
        values:
          type: array
          description: Required for numerical measurements
          items:
            type: number
        image:
          type: string
          description: >
            Required for visual measurements (base64-encoded, with or without a
            `data:image/...;base64,` prefix). Must be a decodable JPEG/PNG/BMP up
            to 16 MB. The server downscales it to at most 1024 px on the longest
            side and re-encodes it as a compressed JPEG before storage, so the
            stored value may differ from the upload.
    UpdateFrequencyRequest:
      type: object
      required: [frequencyDays]
      properties:
        frequencyDays:
          type: integer
          minimum: 1
          description: Days between reminders
    MeasurementCategory:
      type: string
      enum: [numerical, visual]
    BaselineMode:
      type: string
      enum: [none, percent, difference]
      description: |
        How a numerical measurement relates to a user's baseline reading.
        `percent` converts raw readings to percent change from baseline
        (e.g. body mass), `difference` to the plain delta in the measurement's
        unit (e.g. retinal thickness in micrometres), and `none` means the
        reading is absolute and needs no baseline.
    TrendDirection:
      type: string
      enum: [up, down, flat]
    MeasurementSet:
      type: object
      description: >
        One logged measurement event. Exactly one of `values` or `images` is
        populated, matching the measurement's category. Served values of
        baseline-relative measurements are the change from the user's baseline.
        For visual readings, `numAbnormal` records how many abnormalities the
        Crew Medical Officer observed (null = not yet reviewed).
      properties:
        measurementId:
          type: string
        userId:
          type: string
        timestamp:
          type: string
          format: date-time
        values:
          type: [array, "null"]
          items:
            type: number
        images:
          type: [array, "null"]
          items:
            type: string
        numAbnormal:
          type: [integer, "null"]
          description: Abnormalities observed by the CMO (visual readings only)
          minimum: 0
    ChildOverview:
      type: object
      description: One of an officer's children, as listed by GET /users/children.
      properties:
        userId:
          type: string
        username:
          type: string
        latestMeasurement:
          type: [string, "null"]
          format: date-time
          description: When the child last logged any measurement (null if never)
    ChildReminder:
      type: object
      description: One overdue measurement of one of an officer's children.
      properties:
        childId:
          type: string
        measurementId:
          type: string
        dueDate:
          type: string
          format: date-time
    UserStatus:
      type: string
      description: >
        The user's role. A medical officer can have children and judge
        visual images; a normal user can have an officer.
      enum: [normal, medical officer]
    Instruction:
      type: object
      properties:
        image:
          type: string
          description: Image reference for the step
        text:
          type: string
          description: Step text
    Measurement:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/MeasurementCategory"
        unit:
          type: [string, "null"]
        ranges:
          type: array
          description: >
            One range per environment (spacecraft, station, rover, moon, mars).
            Scoring and badge evaluation use the range matching the user's
            current environment; inside a range, a null bound means that side
            does not apply.
          items:
            $ref: "#/components/schemas/Range"
        canBeNegative:
          type: boolean
        baselineMode:
          $ref: "#/components/schemas/BaselineMode"
        lowRecommendation:
          type: [string, "null"]
        highRecommendation:
          type: [string, "null"]
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/Instruction"
    Range:
      type: object
      description: >
        Guideline bounds for one measurement in one environment. Every bound
        is optional: a null side does not apply there.
      properties:
        situation:
          $ref: "#/components/schemas/Environment"
        dangerousLow:
          type: [number, "null"]
        abnormalLow:
          type: [number, "null"]
        abnormalHigh:
          type: [number, "null"]
        dangerousHigh:
          type: [number, "null"]
    Environment:
      type: string
      enum: [spacecraft, station, rover, moon, mars]
      description: >
        The situation the user is in: a spacecraft in transit, a space station
        in low Earth orbit, a pressurized rover, a Moon base, or a Mars base.
    RiskCategory:
      type: string
      enum: [physical, psychological]
    RiskFactor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/RiskCategory"
        measurementIds:
          type: array
          description: Child measurements (empty for risks with no usable data yet)
          items:
            type: string
        reason:
          type: string
          description: Why to pay attention to this risk
    RiskEvaluation:
      type: object
      description:
        Score starts at 100 and is lowered by abnormal measurements (floor of 1).
        `advice` collects the recommendation string of every abnormal
        measurement, most severe first.
      properties:
        riskId:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 100
        advice:
          type: array
          items:
            type: string
        reason:
          type: string
    Reminder:
      type: object
      description: An upcoming measurement the user needs to take.
      properties:
        measurementId:
          type: string
        dueDate:
          type: string
          format: date-time
    ReminderDigest:
      type: object
      description: >
        The daily/weekly/monthly reminder digest. The buckets are disjoint:
        every measurement due within a month appears in exactly one bucket, the
        smallest window it falls within — daily holds the urgent (including
        overdue) set, weekly the rest of the week, monthly the rest of the month.
      properties:
        username:
          type: string
        daily:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        weekly:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
    Criterion:
      type: object
      description: >
        One badge condition: readings of any listed measurement ID qualify;
        distinctDays counts each day once, streak requires consecutive days
        (which implies distinct days), isOk requires each reading to be within
        the measurement's normal range (baseline-adjusted), and count is how
        many qualifying readings or days are needed.
      properties:
        measurementType:
          type: array
          items:
            type: string
        distinctDays:
          type: boolean
        streak:
          type: boolean
        isOk:
          type: boolean
        count:
          type: integer
          minimum: 1
    Badge:
      type: object
      description: A badge definition from badges.json; earned when every criterion is satisfied.
      properties:
        title:
          type: string
        description:
          type: string
          description: The human-readable explanation of how to earn the badge.
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
    BadgeStatus:
      type: object
      description: >
        An unearned badge with its progress: one fraction (0.0-1.0) per
        criterion, in criterion order. For streak criteria this is the best
        run of consecutive qualifying days over the required length.
      properties:
        badge:
          $ref: "#/components/schemas/Badge"
        progress:
          type: array
          items:
            type: number
            format: double
            minimum: 0
            maximum: 1
    BadgeSet:
      type: object
      description: The user's badges, split into earned definitions and unearned progress.
      properties:
        earned:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        unearned:
          type: array
          items:
            $ref: "#/components/schemas/BadgeStatus"
    MeasurementTrend:
      type: object
      properties:
        measurementId:
          type: string
        direction:
          oneOf:
            - $ref: "#/components/schemas/TrendDirection"
            - type: "null"
          description: Null when there is not enough history to compare
